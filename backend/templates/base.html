<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶叶拼配审评台</title>
  <style>
    body { font-family: "Palatino Linotype", "Songti SC", serif; background: #f6f1e7; color: #3f2e22; margin: 0; }
    header { background: #6b3e26; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: baseline; }
    header a { color: #f6e7c1; }
    header a.active { color: #fff; font-weight: bold; text-decoration: none; }
    header .spacer { flex: 1; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    table { width: 100%; background: #fffaf3; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #e6d3c0; text-align: left; }
    form.card { background: #fffaf3; padding: 12px; margin-bottom: 16px; }
    .pass { color: #166534; } .fail { color: #9f1239; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #9f1239; padding: 8px 12px; }
    /* 比色卡卡片单选（不是下拉） */
    .shade-cards { display: flex; gap: 10px; margin: 8px 0; }
    .shade-card { flex: 1; cursor: pointer; border: 2px solid #d9c3ad; border-radius: 8px; padding: 0; background: #fff; }
    .shade-card input { position: absolute; opacity: 0; pointer-events: none; }
    .shade-card .chip { display: block; border-radius: 6px; text-align: center; padding: 14px 6px; }
    .shade-card .swatch { display: block; height: 34px; border-radius: 4px; margin: 8px auto; width: 70%; }
    .shade-card .band { display: block; font-size: 12px; color: #7a6450; padding: 0 6px 10px; }
    .shade-card input:checked + .chip { outline: 3px solid #6b3e26; outline-offset: 1px; }
    .swatch.light { background: #f2d9a0; }
    .swatch.medium { background: #c88a3d; }
    .swatch.dark { background: #6e3b17; }
    .shade-tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .shade-tag.light { background: #f2d9a0; color: #5b4413; }
    .shade-tag.medium { background: #c88a3d; color: #fff; }
    .shade-tag.dark { background: #6e3b17; color: #fff; }
    .pager { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
    .readonly-hint { color: #7a6450; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <strong>茶叶拼配审评台</strong>
    {% if session.user %}
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>审评台</a>
      <a href="{{ url_for('shades') }}" {% if request.endpoint == 'shades' %}class="active"{% endif %}>比色卡专页</a>
      <span class="spacer"></span>
      <span>{{ session.user }}（{{ '审评员' if session.role == 'writer' else '观察员' }}）</span>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!form.dataset.swap) return;
      event.preventDefault();
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "HX-Request": "true" },
      });
      const html = await res.text();
      if (!res.ok) { alert(html); return; }
      document.querySelector("#rows").insertAdjacentHTML("afterbegin", html);
      form.reset();
    });
  </script>
</body>
</html>

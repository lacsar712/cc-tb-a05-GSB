{% extends "base.html" %}
{% block body %}
{% if can_write %}
<form class="card" method="post" action="{{ url_for('create') }}" data-swap="1">
  <h2>新开一轮审评</h2>
  <input name="lot" placeholder="批次" required />
  <input name="aroma" type="number" step="0.1" min="0" max="10" placeholder="香气" required />
  <input name="taste" type="number" step="0.1" min="0" max="10" placeholder="滋味" required />
  <input name="liquor" type="number" step="0.1" min="0" max="10" placeholder="汤色" required />

  <fieldset style="border:none; padding:0;">
    <legend><strong>汤色比色卡（必须勾选一档）</strong> 档位以
      <a href="{{ url_for('shades') }}">比色卡专页</a> 当前规则为准</legend>
    <div class="shade-cards">
      {% for tier, label in tiers %}
      <label class="shade-card">
        <input type="radio" name="shade" value="{{ tier }}" required />
        <span class="chip">
          <span class="swatch {{ tier }}"></span>
          <strong>{{ label }}</strong>
          <span class="band">{{ band_text(tier, rules) }}</span>
        </span>
      </label>
      {% endfor %}
    </div>
  </fieldset>

  <button>提交</button>
</form>
{% else %}
<p class="readonly-hint">观察员只读：可在
  <a href="{{ url_for('shades') }}">比色卡专页</a> 查看规则与台账，不能交评、不能改规则。</p>
{% endif %}
<table>
  <thead><tr><th>批次</th><th>汤色档</th><th>加权分</th><th>结论</th><th>说明</th><th></th></tr></thead>
  <tbody id="rows">
    {% for row in rows %}{% include "_row.html" %}{% endfor %}
  </tbody>
</table>
{% endblock %}
